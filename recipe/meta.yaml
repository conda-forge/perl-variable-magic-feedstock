{% set name = "perl-variable-magic" %}
{% set version = "0.65" %}
{% set sha256 = "457bfb1b2369e44c0e2ef3e7b61580831107cbeebf0f5d8c4b9b02368550b91e" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://cpan.metacpan.org/authors/id/V/VP/VPIT/Variable-Magic-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  skip: true  # [win]
  number: 0
  run_exports:
    weak:
      - {{ name }} ={{ version }}

requirements:
  build:
    - make
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - perl
  run:
    - perl

test:
  imports:
    - Variable::Magic

about:
  home: http://search.cpan.org/dist/Variable-Magic/
  license: GPL-1.0-or-later OR Artistic-1.0-Perl
  license_file:
    - {{ environ["PREFIX"] }}/man/man1/perlartistic.1
    - {{ environ["PREFIX"] }}/man/man1/perlgpl.1
  summary: 'Associate user-defined magic to variables from Perl.'

extra:
  recipe-maintainers:
    - xileF1337
    - conda-forge/perl-packagers
